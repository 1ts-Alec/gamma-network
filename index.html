<!doctype html><html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gamme</title>
<style>
:root{
  --bg:#000; --bg2:#000;
  --card:#151923; --card2:#362d40;
  --line:#000; --line2:#000; --searchLine:#513f65;
  --text:#e8ebf3; --muted:#8f97ab;
  --acc:#000;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --space:16px;
  --gold:#ffcf5c;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

body{display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header{flex:0 0 auto;display:flex;align-items:center;gap:var(--space);padding:12px var(--space);
  border-bottom:1px solid var(--line);background:rgba(0,0,0,1)}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.wordmark b{color:var(--acc)}
.head-r{flex:1;display:flex;justify-content:center;min-width:0}
.searchw{position:relative;width:min(540px,100%)}
.searchw svg{position:absolute;left:13px;top:50%;translate:0 -50%;opacity:.45;pointer-events:none}
input#q{width:100%;padding:11px 64px 11px 38px;border-radius:12px;font-size:14.5px;
  border:1px solid var(--searchLine);background:var(--bg2);color:var(--text);outline:none;
  transition:border-color .15s, box-shadow .15s}
input#q::placeholder{color:var(--muted)}
input#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.16)}
.kbd-hint{position:absolute;right:11px;top:50%;translate:0 -50%;font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;user-select:none;pointer-events:none}

/* ---------- body ---------- */
#sc{flex:1;min-height:0;position:relative;overflow-y:scroll;overscroll-behavior:contain}
#grid{position:relative;padding:var(--space);
  max-width:1720px;margin:0 auto;overflow-anchor:none}
#spacer{position:relative;width:1px;opacity:0;pointer-events:none}
.row{position:absolute;top:0;left:var(--space);display:flex;gap:var(--space);will-change:transform}

/* ---------- meta row (count) ---------- */
.meta-row{display:flex;align-items:center;gap:var(--space);justify-content:space-between;padding:6px 2px 12px}
.count{font-size:12.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.seg{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ---------- card ---------- */
.card{display:block;width:var(--cw);color:inherit;text-decoration:none;user-select:none}
.lic{aspect-ratio:1/1;border-radius:13px;overflow:hidden;background:var(--mbg);
  border:1px solid var(--line);position:relative;
  transition:transform .18s,border-color .18s;display:block}
.lic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.lic img.on{opacity:1}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cw)*.30);color:rgba(255,255,255,.30);letter-spacing:.02em}
.meta{padding:8px 2px 0;line-height:1.25}
.name{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.author{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card:hover .lic{transform:translateY(-3px);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:13px}
.card .lic{content-visibility:auto}

/* ---------- stars / empty / status ---------- */
.empty{display:none;padding:88px 0 40px;text-align:center;color:var(--muted)}
.empty .big{font-size:17px;font-weight:650;color:var(--text)}
.empty .small{font-size:13px;margin-top:6px}
#status{position:absolute;left:0;right:0;top:0;height:62vh;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--muted);font-size:14px;padding:0 22px;text-align:center}
#status code{color:var(--acc);font-size:12px;background:var(--bg2);border:1px solid var(--line);
  padding:2px 8px;border-radius:7px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--searchLine);
  border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#f0a0a8;font-size:14px;max-width:560px;line-height:1.55}
.err code{font-size:12px}

/* ---------- in-site player ---------- */
#player{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,12,.62);padding:0}
#player.on{display:flex}
#player.max{background:#000}
.player-stage{position:relative;width:85vw;height:85vh;max-width:85vw;max-height:85vh;
  border-radius:13px;overflow:hidden;background:#000;border:1px solid var(--line);
  box-shadow:0 28px 80px rgba(0,0,0,.55)}
#player.max .player-stage{width:100vw;height:100vh;max-width:none;max-height:none;
  border-radius:0;border:0;box-shadow:none}
.player-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
.player-btns{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px;pointer-events:none}
.player-btns button{pointer-events:auto;appearance:none;width:32px;height:32px;padding:0;border-radius:8px;
  border:1px solid rgba(255,255,255,.14);background:rgba(12,14,18,.48);color:#e8ebf3;
  display:grid;place-items:center;cursor:pointer;opacity:.7;backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);transition:opacity .15s,background .15s,border-color .15s;
  touch-action:manipulation;user-select:none}
.player-btns button:hover,.player-btns button:focus-visible{opacity:1;background:rgba(12,14,18,.82);
  border-color:rgba(255,255,255,.28);outline:none}
.player-btns button:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.player-btns svg{display:block}
#player.max .i-max,#player:not(.max) .i-rest{display:none}
#player.max .player-btns{display:none}
.player-load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,14,.55);pointer-events:none;z-index:1;flex-direction:column;gap:12px}
.player-load.on{display:flex}

/* ---------- responsive ---------- */
@media (max-width:760px){
  :root{--space:12px}
  .wordmark span.long{display:none}
  header{gap:10px;padding:11px 12px}
  .kbd-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .lic,.lic img{transition:none}
  .spin{animation-duration:.001s}
  .player-btns button{transition:none}
}
</style>

<script>
 
window.SITE_DEFAULTS = {
  zonesUrl:   "https://cdn.jsdelivr.net/gh/1ts-Alec/assets@main/zones.json",
  htmlBase:   "https://cdn.jsdelivr.net/gh/1ts-Alec/html@main",
  title:      "G@M3S"
};
</script>
<script src="https://cdn.jsdelivr.net/gh/1ts-Alec/site-config@main/config.js" onerror="window.__configFailed=true"></script>
</head>
<body>

<noscript><div style="padding:40px;font-family:sans-serif">How th you even use the interweb w no js dawg xDDD</div></noscript>

<header>
  <div class="wordmark"><span class="long" id="wordmark">G@M3S</span></div>
  <div class="head-r">
    <div class="searchw">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b5" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false" enterkeyhint="search" autofocus>
      <span class="kbd-hint">/</span>
    </div>
  </div>
  <div class="meta-row" style="padding:0">
    <div class="seg" id="seg">
      <button type="button" class="on" data-f="0">All</button><button type="button" data-f="1">Featured</button>
    </div>
    <span class="count" id="countTop"></span>
  </div>
</header>

<main id="sc" tabindex="-1">
  <div id="grid">
    <div id="spacer"></div>
    <div id="status"><div class="spin" id="spin"></div><div id="statusText">Loading game list…</div></div>
    <div class="empty" id="empty">
      <div class="big">No matches</div>
      <div class="small">Try a different spelling — searching names and authors.</div>
    </div>
  </div>
</main>

<div id="player" role="dialog" aria-modal="true" aria-label="Game player" hidden>
  <div class="player-stage" id="playerStage">
    <iframe id="playerFrame" title="Game" allowfullscreen
      allow="autoplay; fullscreen; gamepad; keyboard-map; pointer-lock; clipboard-read; clipboard-write; accelerometer; gyroscope; xr-spatial-tracking"></iframe>
    <div class="player-load" id="playerLoad">
      <div class="spin" id="playerSpin"></div>
      <div class="err" id="playerErr" hidden></div>
    </div>
    <div class="player-btns">
      <button type="button" id="playerMax" title="Maximize" aria-label="Maximize">
        <svg class="i-max" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        <svg class="i-rest" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button type="button" id="playerClose" title="Close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================ config ============================ */
const CFG = Object.assign({}, window.SITE_DEFAULTS || {}, window.SITE_CONFIG || {});
document.title = CFG.title;
document.getElementById('wordmark').textContent = CFG.title;

const clean = s => String(s || '').replace(/\/+$/, '');
const hrefFor = u => !u ? '#' : u.replace('{HTML_URL}', clean(CFG.htmlBase));
const coverFor = u => !u ? ''  : u.replace('{COVER_URL}', clean(CFG.coversBase));

/* ============================ dom refs ============================ */
const sc     = document.getElementById('sc');
const grid   = document.getElementById('grid');
const spacer = document.getElementById('spacer');
const status = document.getElementById('status');
const spin   = document.getElementById('spin');
const statusText = document.getElementById('statusText');
const emptyBox = document.getElementById('empty');
const countTop = document.getElementById('countTop');
const qInput = document.getElementById('q');
const seg = document.getElementById('seg');
const player      = document.getElementById('player');
const playerStage = document.getElementById('playerStage');
const playerFrame = document.getElementById('playerFrame');
const playerLoad  = document.getElementById('playerLoad');
const playerMax   = document.getElementById('playerMax');
const playerClose = document.getElementById('playerClose');
seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  featOnly = b.dataset.f === '1';
  for (const x of seg.children) x.classList.toggle('on', x === b);
  applySearch();
});
const ITEM_H = 56;
let GAP = 16;
const MIN_CARD = 150, OVERSCAN = 2;
let cols = 0, rowH = 0, colW = 0, padTop = 0;
let ALL = [];
let VIEW = [];
const pool = [];
let paintedSt = -1, paintedEn = -1;
let needRows = 0;

function measure(){
  GAP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--space')) || 16;
  const cs = getComputedStyle(grid);
  const padL = parseFloat(cs.paddingLeft) || 16;
  padTop = parseFloat(cs.paddingTop) || 0;
  const avail = grid.clientWidth - padL * 2;
  const c = Math.max(1, Math.floor((avail + GAP) / (MIN_CARD + GAP)));
  cols = c;
  colW = (avail - (c - 1) * GAP) / c;
  rowH = colW + ITEM_H + GAP;
  grid.style.setProperty('--cw', colW + 'px');
  return c;
}

function lettersOf(name){
  const w = String(name || '?').replace(/^\W+/, '');
  const parts = w.split(/\s+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function tintOf(name){
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ' 30% 19%)';
}

function addCard(row){
  const a = document.createElement('a');
  a.className = 'card';
  a.draggable = false;
  const lic = document.createElement('span');
  lic.className = 'lic';
  const mono = document.createElement('span'); mono.className = 'mono';
  const img = document.createElement('img');
  img.loading = 'lazy'; img.decoding = 'async'; img.draggable = false; img.alt = '';
  img.referrerPolicy = 'no-referrer';
  const meta = document.createElement('span'); meta.className = 'meta';
  const nm = document.createElement('span'); nm.className = 'name';
  const au = document.createElement('span'); au.className = 'author';
  meta.append(nm, au);
  lic.append(mono, img);
  a.append(lic, meta);
  const rec = { el: a, img, mono, nm, au, lic, key: '', ok: true };
  img.addEventListener('load', () => { rec.ok = true; img.classList.add('on'); mono.style.display = 'none'; });
  img.addEventListener('error', () => { rec.ok = false; img.classList.remove('on'); img.style.display = 'none'; mono.style.display = 'flex'; });
  row.cards.push(rec);
  row.el.appendChild(a);
}

function createRow(){
  const el = document.createElement('div');
  el.className = 'row';
  const row = { el, index: -1, cards: [] };
  const cap = Math.ceil((sc.clientWidth || 1200) / (MIN_CARD + GAP)) + 4;
  for (let i = 0; i < cap; i++) addCard(row);
  return row;
}

function ensureRowCapacity(){
  for (const row of pool) while (row.cards.length < cols) addCard(row);
}

function paintCard(rec, g){
  const key = g[0] + '|' + g[3];
  if (rec.key === key && rec.ok) return;
  rec.key = key;
  rec.el.href = hrefFor(g[3]);
  rec.nm.textContent = g[0];
  const by = g[1] ? 'by ' + g[1] : '';
  if (rec.au.textContent !== by) rec.au.textContent = by;
  rec.mono.textContent = g[4];
  rec.lic.style.background = g[5];
  const src = coverFor(g[2]);
  const cur = rec.img.getAttribute('src');
  if (cur !== src || !rec.ok){
    rec.img.classList.remove('on');
    rec.img.style.display = '';
    rec.mono.style.display = 'flex';
    rec.ok = true;
    rec.img.src = src;
  }
}

function paintRow(row, index){
  if (row.index === index && row.el.style.display === 'flex') return;
  row.index = index;
  row.el.style.display = 'flex';
  row.el.style.transform = 'translate3d(0,' + (index * rowH + padTop) + 'px,0)';
  const start = index * cols;
  for (let i = 0; i < row.cards.length; i++){
    const rec = row.cards[i];
    const g = VIEW[start + i];
    if (g && i < cols){ rec.el.style.display = ''; paintCard(rec, g); }
    else rec.el.style.display = 'none';
  }
}

function hideRow(row){ row.index = -1; row.el.style.display = 'none'; }

function setPoolSize(n){
  n = Math.max(0, n | 0);
  while (pool.length < n){ const r = createRow(); pool.push(r); grid.appendChild(r.el); }
  needRows = n;
}

function ensurePainted(st, en){
  if (st === paintedSt && en === paintedEn) return;
  paintedSt = st; paintedEn = en;
  for (let k = 0; k < pool.length; k++){
    if (k < needRows && st + k <= en) paintRow(pool[k], st + k);
    else hideRow(pool[k]);
  }
}

function visibleRange(){
  const totalRows = Math.max(1, Math.ceil(VIEW.length / cols));
  const y = sc.scrollTop, vh = sc.clientHeight;
  const st = Math.max(0, Math.floor(y / rowH) - OVERSCAN);
  const en = Math.min(totalRows - 1, Math.ceil((y + vh) / rowH) + OVERSCAN);
  return [st, en, totalRows];
}

function doLayout(){
  if (!cols) return;
  let [st, en, totalRows] = visibleRange();
  spacer.style.height = Math.max(0, totalRows * rowH - GAP) + 'px';
  void sc.scrollTop;
  [st, en, totalRows] = visibleRange();
  countTop.textContent = VIEW.length ? VIEW.length + ' titles ' : '';
  emptyBox.style.display = (ALL.length && !VIEW.length) ? 'block' : 'none';
  const need = Math.min(totalRows, Math.max(1, en - st + 1));
  setPoolSize(need);
  paintedSt = -1; ensurePainted(st, en);
}

let rafPend = false;
function update(force){
  if (rafPend) return;
  rafPend = true;
  requestAnimationFrame(() => {
    rafPend = false;
    if (!cols || !pool.length) return;
    const [st, en] = visibleRange();
    ensurePainted(st, en);
  });
}
sc.addEventListener('scroll', () => update(false), { passive: true });

let rsT = 0;
new ResizeObserver(() => {
  const old = cols;
  measure();
  ensureRowCapacity();
  if (cols !== old){
    clearTimeout(rsT);
    rsT = setTimeout(() => { for (const r of pool) r.index = -1; doLayout(); }, 60);
  } else update(false);
}).observe(grid);

/* ============================ data ============================ */
function buildItems(zones){
  const items = [];
  for (const z of zones){
    if (z.id < 0) continue;
    const name = z.name || ('Game ' + z.id);
    const author = z.author || '';
    items.push([name, author, z.cover || '', z.url || '', 0, 0, 0, z.featured ? 1 : 0]);
  }
  items.sort((a, b) => a[0].toLowerCase().localeCompare(b[0].toLowerCase(), undefined, { sensitivity: 'base' }));
  for (const it of items){
    it[4] = lettersOf(it[0]);
    it[5] = tintOf(it[0]);
    it[6] = (it[0] + '\n' + it[1]).toLowerCase();
  }
  return items;
}

let curQuery = '', featOnly = false;
function applySearch(){
  const t = curQuery.trim().toLowerCase();
  VIEW = ALL.filter(g => (!featOnly || g[7]) && (!t || g[6].includes(t)));
  for (const r of pool) r.index = -1;
  doLayout();
}

let searchT = 0;
qInput.addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { curQuery = qInput.value; applySearch(); }, 60);
});
qInput.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ qInput.value = ''; curQuery = ''; applySearch(); qInput.blur(); }
});
document.addEventListener('keydown', e => {
  if (playerOpen){
    if (e.key === 'Escape'){
      if (fsElement()) return;
      if (player.classList.contains('max')){ e.preventDefault(); setMaximized(false); return; }
      e.preventDefault(); closePlayer();
    }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === '/' && tag !== 'input' && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); qInput.focus(); }
});

let playerOpen = false;
let playerBlob = '';
let playerHtml = '';
let playerAbort = null;
let playerWantMax = false;
const playerSpin = document.getElementById('playerSpin');
const playerErr  = document.getElementById('playerErr');

function isEmbedded(){ try { return window.self !== window.top; } catch (_){ return true; } }
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function requestFs(el){
  if (!el) return Promise.reject(new Error('no element'));
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (!req) return Promise.reject(new Error('unsupported'));
  try { return Promise.resolve(req.call(el, { navigationUI: 'hide' })); }
  catch (err){ return Promise.reject(err); }
}
function exitFs(){
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (fsElement() && exit) Promise.resolve(exit.call(document)).catch(() => {});
}
function setMaxLabel(on){
  playerMax.title = on ? 'Restore' : 'Maximize';
  playerMax.setAttribute('aria-label', on ? 'Restore' : 'Maximize');
}
function setMaximized(on){
  if (on){
    player.classList.add('max');
    setMaxLabel(true);
    requestFs(document.documentElement).catch(() => {});
  } else {
    playerWantMax = false;
    exitFs();
    player.classList.remove('max');
    setMaxLabel(false);
  }
}
function popOutGame(){
  const html = playerHtml;
  if (!html){ playerWantMax = true; return; }
  closePlayer();
  const w = window.open('about:blank', '_blank');
  if (!w) return;
  try {
    w.document.open();
    w.document.write(html);
    w.document.close();
  } catch (_){}
  try { w.focus(); } catch (_){}
}
function revokePlayerBlob(){
  if (playerBlob){ URL.revokeObjectURL(playerBlob); playerBlob = ''; }
}
function resetFrame(){
  revokePlayerBlob();
  playerHtml = '';
  playerFrame.removeAttribute('srcdoc');
  playerFrame.src = 'about:blank';
}
function showPlayerLoad(){
  playerErr.hidden = true;
  playerErr.textContent = '';
  playerSpin.style.display = '';
  playerLoad.classList.add('on');
}
function showPlayerError(msg){
  playerSpin.style.display = 'none';
  playerErr.hidden = false;
  playerErr.textContent = msg;
  playerLoad.classList.add('on');
}
function openPlayer(url, name){
  if (!url || url === '#') return;
  playerOpen = true;
  player.hidden = false;
  player.classList.add('on');
  setMaximized(false);
  player.setAttribute('aria-label', name ? name : 'Game player');
  playerFrame.title = name || 'Game';
  showPlayerLoad();
  resetFrame();
  if (playerAbort) playerAbort.abort();
  const ctl = playerAbort = new AbortController();
  fetch(url, { signal: ctl.signal }).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(html => {
    if (!playerOpen || ctl !== playerAbort) return;
    playerHtml = html;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    playerBlob = URL.createObjectURL(blob);
    playerFrame.src = playerBlob;
    if (playerWantMax){ playerWantMax = false; popOutGame(); }
  }).catch(err => {
    if (err && err.name === 'AbortError') return;
    if (!playerOpen || ctl !== playerAbort) return;
    showPlayerError('Couldn\'t load this game (' + (err && err.message || err) + ').');
  });
}
function closePlayer(){
  if (!playerOpen) return;
  playerOpen = false;
  if (playerAbort){ playerAbort.abort(); playerAbort = null; }
  setMaximized(false);
  player.classList.remove('on');
  player.hidden = true;
  playerLoad.classList.remove('on');
  resetFrame();
}

grid.addEventListener('click', e => {
  const a = e.target.closest('a.card');
  if (!a || !grid.contains(a)) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const url = a.href;
  if (!url || url === location.href || url.endsWith('#')) return;
  e.preventDefault();
  openPlayer(url, (a.querySelector('.name') || {}).textContent || 'Game');
});
player.addEventListener('click', e => { if (e.target === player) closePlayer(); });
playerMax.addEventListener('click', e => {
  e.stopPropagation();
  if (isEmbedded()) popOutGame();
  else setMaximized(!player.classList.contains('max'));
});
playerClose.addEventListener('click', e => { e.stopPropagation(); closePlayer(); });
playerFrame.addEventListener('load', () => {
  if (!playerOpen) return;
  const src = playerFrame.getAttribute('src');
  if (!src || src === 'about:blank') return;
  playerLoad.classList.remove('on');
  try { playerFrame.focus({ preventScroll: true }); } catch(_){}
});
function onFsChange(){
  if (!playerOpen) return;
  const on = !!fsElement();
  player.classList.toggle('max', on);
  setMaxLabel(on);
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

async function boot(){
  measure();
  status.style.display = 'flex';
  let zones;
  try{
    const res = await fetch(CFG.zonesUrl, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    zones = await res.json();
  }catch(err){
    spin.style.display = 'none';
    statusText.outerHTML =
      '<div class="err">ts broken ill fix it dw</div>';
    return;
  }
  ALL = buildItems(zones);
  VIEW = ALL;
  status.style.display = 'none';
  measure();
  doLayout();
}
boot();
</script>
</body>

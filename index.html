<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gamma</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #000; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .wrap { width: min(720px, 100%); text-align: center; }
    .logo { width: 56px; height: 56px; margin: 0 auto 28px; display: block; }
    h1 {
      margin: 0 0 28px; font-size: 42px; font-weight: 700;
      letter-spacing: -0.02em; color: #fff;
    }
    p {
      margin: 0 auto; max-width: 34em; font-size: 16px;
      line-height: 1.5; font-weight: 400; color: #fff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Welcome to Gamma</h1>
    <p>Gamma is a no-frills entertainment hub for games, movies, and TV shows.</p>
  </main>
</body>
</html>
